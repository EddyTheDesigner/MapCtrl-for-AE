name: Check panel
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - name: Verify generated assets are current
        run: git diff --exit-code -- src/data.jsxinc docs/map-preview.svg dist/MapCtrl.jsx
